# ============================================================
# --- 基础监听 ---
# ============================================================
# 注意：Clash Verge 会在「设置 → 端口」里覆盖 mixed-port，想换端口请改 Verge 的设置，改这里不生效。
mixed-port: 7897
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false                # 与 dns下的ipv6 保持一致，避免空等
unified-delay: true        # 统一延迟口径，组内延迟才可比
tcp-concurrent: true
find-process-mode: off     # 没有 PROCESS 项，关掉可减少 Windows 系统调用开销
profile:
  store-fake-ip: true

# ============================================================
# --- DNS ---
# ============================================================
dns:
  enable: true
  ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  respect-rules: true

  # 引导 DNS：只用于解析 DoH 服务器域名，必须是纯 IP
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 主 DNS：UDP 优先，DoH 作备用。
  nameserver:
    - 223.5.5.5                          # 阿里
    - 119.29.29.29                       # 腾讯
    - "https://223.5.5.5/dns-query"      # 阿里 DoH
    - "https://1.12.12.12/dns-query"     # 腾讯 DoH

  # 解析机场/节点域名用：必须直连可达。
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - "https://223.5.5.5/dns-query"

  nameserver-policy:
    # 连通性探测 / NTP 走系统 DNS，避免公共 WiFi 登录页弹不出来
    "+.msftncsi.com": system
    "+.msftconnecttest.com": system
    "captive.apple.com": system
    "connectivitycheck.gstatic.com": system
    "connectivitycheck.android.com": system
    "connect.rom.miui.com": system
    "+.pool.ntp.org": system
    "time.windows.com": system
    "time.cloudflare.com": system

    # 国内域名固定国内 DNS：一条一个 geosite，语义清晰
    "geosite:cn":
      - 223.5.5.5
      - 119.29.29.29
    "geosite:private":
      - 223.5.5.5
      - 119.29.29.29
    "geosite:apple":
      - 223.5.5.5
      - 119.29.29.29
    "geosite:microsoft@cn":
      - 223.5.5.5
      - 119.29.29.29
    "geosite:category-games@cn":
      - 223.5.5.5
      - 119.29.29.29

  fake-ip-filter:
    # 局域网 / 路由后台
    - "geosite:private"
    - "+.lan"
    - "+.local"
    - "+.internal"
    - "+.localdomain"
    - "+.home.arpa"
    - "+.bogon"
    - "+.m2m"
    - localhost
    - router.asus.com
    - miwifi.com
    - tplogin.cn
    - tendawifi.com
    - p.to

    # AdGuard
    - injections.adguard.org
    - local.adguard.org

    # 网络连通性探测
    - "+.msftncsi.com"
    - "+.msftconnecttest.com"
    - captive.apple.com
    - connectivitycheck.gstatic.com
    - connectivitycheck.android.com
    - connect.rom.miui.com

    # 游戏 STUN / NAT
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
    - "xbox.*.microsoft.com"
    - "+.battlenet.com.cn"
    - "+.turn.twilio.com"
    - "+.stun.twilio.com"
    - stun.syncthing.net
    - stun.l.google.com
    - stun.cloudflare.com

    # NTP
    - "+.pool.ntp.org"
    - time.windows.com
    - time.nist.gov
    - time.apple.com
    - time.asia.apple.com
    - time.cloudflare.com

    # 开发者泛域名
    - "+.sslip.io"
    - "+.nip.io"
    - 127.atlas.skk.moe

# ============================================================
# --- 域名嗅探 ---
# ============================================================
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: true
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.mi.com"
    - "+.xiaomi.com"
    - "+.xiaomi.net"
    - "+.mijia.tech"
    - "+.push.apple.com"
    - "+.apple.com"
    - "+.local"
    - "+.lan"
    - "+.home.arpa"

# --- GeoData ---
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

