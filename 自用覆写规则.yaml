# ==============================================================================
# 七、路由规则
# ==============================================================================
rules:
  # ---------- 1. 局域网 / 本机 / 电信 CGNAT：直连 ----------
  # 放在最前面，避免下面拦 QUIC 的规则误伤投屏、NAS、打印机等局域网流量
  # 私有域名（.lan/.local/内网反查）直接连
  - GEOSITE,PRIVATE,DIRECT
  # 私有 IP 段（10/8、172.16/12、192.168/16、127/8 等）直接连
  - GEOIP,LAN,DIRECT,no-resolve
  # 本机回环 127.0.0.0/8
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  # A 类私有网段 10.0.0.0/8（企业网、部分路由器）
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  # B 类私有网段 172.16.0.0/12（Docker/WSL/Hyper-V 虚拟网卡常用）
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  # C 类私有网段 192.168.0.0/16（家用路由器默认网段）
