# ============================================================
# --- 规则集 ---
# ============================================================
rule-providers:
  ADBlock:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://adrules.top/adrules-mihomo.mrs
    path: ./ruleset/ADBlock.mrs
  EHentai:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://fastly.jsdelivr.net/gh/powerfullz/override-rules@master/ruleset/EHentai.list
    path: ./ruleset/EHentai.list
  SteamFix:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://fastly.jsdelivr.net/gh/powerfullz/override-rules@master/ruleset/SteamFix.list
    path: ./ruleset/SteamFix.list
  GoogleFCM:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://fastly.jsdelivr.net/gh/powerfullz/override-rules@master/ruleset/FirebaseCloudMessaging.list
    path: ./ruleset/FirebaseCloudMessaging.list
  AdditionalFilter:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://fastly.jsdelivr.net/gh/powerfullz/override-rules@master/ruleset/AdditionalFilter.list
    path: ./ruleset/AdditionalFilter.list
  DMM:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/DMM/DMM.list
    path: ./ruleset/DMM.list

rules:
  # 1. 局域网 / 本机 / 电信 CGNAT 直连（先于 QUIC 拦截，避免误伤投屏、NAS）
  - GEOSITE,PRIVATE,DIRECT
  - GEOIP,LAN,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # 2. 广告
  - RULE-SET,ADBlock,REJECT
  - RULE-SET,AdditionalFilter,REJECT

  # 3. 特殊应用 & 自定义域名
  - RULE-SET,EHentai,美国节点
  - RULE-SET,DMM,日本节点
  - RULE-SET,GoogleFCM,选择代理
  - RULE-SET,SteamFix,选择代理
  - DOMAIN,services.googleapis.cn,选择代理
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,选择代理

  - DOMAIN-SUFFIX,f95zone.to,美国节点
  - DOMAIN-SUFFIX,gelbooru.com,美国节点
  - DOMAIN-KEYWORD,dlsite,日本节点

  - DOMAIN-SUFFIX,hxcy.top,非日韩节点
  - DOMAIN-SUFFIX,hanime1.me,非日韩节点
  - DOMAIN-SUFFIX,kurogames-global.com,选择代理
  - DOMAIN-KEYWORD,aki-game.net,选择代理

  # 4. AI / 开发服务
  - DOMAIN-SUFFIX,openai.com,选择代理
  - DOMAIN-SUFFIX,oaistatic.com,选择代理
  - DOMAIN-SUFFIX,oaiusercontent.com,选择代理
  - DOMAIN-SUFFIX,chatgpt.com,选择代理
  - DOMAIN-SUFFIX,anthropic.com,选择代理
  - DOMAIN-SUFFIX,claude.ai,选择代理
  - DOMAIN-SUFFIX,gemini.google.com,选择代理
  - DOMAIN-SUFFIX,aistudio.google.com,选择代理
  - DOMAIN-SUFFIX,cursor.sh,选择代理
  - DOMAIN-SUFFIX,cursor.com,选择代理
  - DOMAIN-SUFFIX,github.com,选择代理
  - DOMAIN-SUFFIX,githubusercontent.com,选择代理
  - DOMAIN-SUFFIX,githubassets.com,选择代理
  - DOMAIN-SUFFIX,copilot.microsoft.com,选择代理
  - DOMAIN-SUFFIX,copilot.cloud.microsoft.com,选择代理

  # 5. GeoSite 规则
  - GEOSITE,GOOGLE,选择代理
  - GEOSITE,TELEGRAM,Telegram
  - GEOSITE,YOUTUBE,YouTube
  - GEOSITE,GFW,选择代理
  - GEOSITE,MICROSOFT@CN,DIRECT
  - GEOSITE,MICROSOFT,DIRECT
  - GEOSITE,APPLE,DIRECT
  - GEOSITE,BILIBILI,DIRECT
  - GEOSITE,STEAM@CN,DIRECT
  - GEOSITE,STEAM,选择代理
  - GEOSITE,CN,DIRECT

  # 6. GeoIP 兜底
  - GEOIP,GOOGLE,选择代理,no-resolve
  - GEOIP,TELEGRAM,Telegram,no-resolve
  - GEOIP,CN,DIRECT,no-resolve

  # 7. 拦截 UDP/443（QUIC）
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # 8. 最终兜底
  - MATCH,选择代理
