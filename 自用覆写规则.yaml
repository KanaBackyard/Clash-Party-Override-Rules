# ==============================================================================
# 一、基础监听与全局行为
# ==============================================================================

# 混合代理端口。注意：Clash Verge 会在「设置 → 端口」里覆盖此值，改这里不生效，要改去界面改。
mixed-port: 7897

# 是否允许局域网内其它设备连入本机代理端口。
allow-lan: false

# 代理端口绑定的网卡地址。127.0.0.1 = 只监听回环，外网不可达。
bind-address: 127.0.0.1

# 运行模式：rule（按规则分流）/ global（全部走同一节点）/ direct（全部直连）。
mode: rule

# 日志详细程度：silent / error / warning / info / debug。
log-level: silent

# 是否启用 IPv6 转发。与 dns.ipv6 保持一致，避免 AAAA 查询白等超时。
ipv6: false

# 统一延迟口径：测速结果减去 TCP 握手前的 DNS 时间，让不同节点可公平比较。
unified-delay: true

# TCP 并发：DNS 解析出多个 IP 时同时发起连接，取最快成功的那个。
tcp-concurrent: true

# 进程匹配模式：always（强制匹配）/ strict（按需）/ off（完全不匹配）。关掉可省掉 Windows 上的系统调用开销。
find-process-mode: off

# 【新增】全局连接超时时间（毫秒），建议显式指定为 3000 或 5000（即 3-5 秒），
# 避免电信网络卡顿时，内核无限制地等待某个死掉的 IP 握手
timeout: 5000

# 配置文件相关
profile:
  # 重启后记住上次手动选择的节点，不会跳回默认（强烈建议开启）。
  store-selected: true
  # 重启后保留 fake-ip 映射表，减少重连后的 DNS 重复查询。
  store-fake-ip: true


# ==============================================================================
# 二、DNS
# ==============================================================================
dns:
  # 是否启用 mihomo 内置 DNS。关闭则全部交给系统 DNS，代理分流会失准。
  enable: true

  # 是否解析 AAAA 记录。false = 对 AAAA 返回空，避免 IPv6 不可用时的长时间等待。
  ipv6: false

  # DoH 是否优先走 HTTP/3。官方明确「与 respect-rules 强烈不建议同时使用」，
  prefer-h3: false

  # 是否响应配置里的 hosts 项。
  use-hosts: true

  # 是否同时查询系统 hosts 文件（Windows 的 C:\Windows\System32\drivers\etc\hosts）。
  use-system-hosts: true

  # DNS 增强模式：fake-ip（返回假 IP，配合分流最佳）/ redir-host（返回真实 IP）。
  enhanced-mode: fake-ip

  # fake-ip 使用的地址段。198.18.0.0/15 是 RFC 保留段，不会与公网地址冲突。
  fake-ip-range: 198.18.0.1/16

  # fake-ip-filter 的模式：blacklist（列表内返回真实 IP）/ whitelist（列表内才返回假 IP）。
  fake-ip-filter-mode: blacklist

  # DNS 发出的连接是否遵守路由规则（即走代理还是直连按 rules 判定）。
  # 需要配合下面的 proxy-server-nameserver，否则会出现「解析节点域名要先连节点」的死循环。
  respect-rules: true

  # --- 引导 DNS ---
  # 专门用来解析「DNS 服务器自身的域名」，必须是纯 IP（或 IP 形式的 DoH）。
  default-nameserver:
    - 223.5.5.5              # 阿里公共 DNS（IPv4）
    - 119.29.29.29           # 腾讯 DNSPod（IPv4）

  # --- 主 DNS ---
  # 阿里/腾讯的 UDP 在前（电信直连延迟最低，通常 5-15ms），DoH 在后作备用。
  # 全部用 IP 形式，不存在「解析 DNS 服务器要先解析它自己」的环路。
  nameserver:
    - 223.5.5.5                          # 阿里公共 DNS（UDP）
    - 119.29.29.29                       # 腾讯 DNSPod（UDP）
    - "https://223.5.5.5/dns-query"      # 阿里 DoH（IP 形式，免解析）
    - "https://1.12.12.12/dns-query"     # 腾讯 DoH（IP 形式，免解析）

  # --- 节点域名专用 DNS ---
  # 只用于解析机场/代理节点自身的域名，必须直连可达。
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - "https://223.5.5.5/dns-query"

  # --- 指定域名的解析服务器（优先级高于 nameserver）---
  nameserver-policy:
    # 网络连通性探测：走系统 DNS，保证公共 WiFi 的登录页能正常弹出
    "+.msftncsi.com": system
    # Windows 的 NCSI 连通性检测（任务栏网络图标若带感叹号就是它失败）
    "+.msftconnecttest.com": system
    # 苹果设备的 Captive Portal 检测
    "captive.apple.com": system
    # 谷歌/安卓的连通性检测
    "connectivitycheck.gstatic.com": system
    "connectivitycheck.android.com": system
    # 小米/MIUI 的连通性检测
    "connect.rom.miui.com": system
    # NTP 时间同步池（时间偏差会导致 TLS 证书校验失败，必须能通）
    "+.pool.ntp.org": system
    # Windows 时间同步服务器
    "time.windows.com": system
    # Cloudflare 时间服务器
    "time.cloudflare.com": system

    # 国内域名固定用国内 DNS，跳过主备判定，首解析更快
    # 所有 .cn 域名与国内常用站
    "geosite:cn":
      - 223.5.5.5
      - 119.29.29.29
    # 局域网与私有域名（.lan / .local / 内网 IP 反查等）
    "geosite:private":
      - 223.5.5.5
      - 119.29.29.29
    # 苹果全系域名（App Store、iCloud、推送等）
    "geosite:apple":
      - 223.5.5.5
      - 119.29.29.29
    # 微软中国区域名（Office 365、Azure 中国、Windows 更新）
    "geosite:microsoft@cn":
      - 223.5.5.5
      - 119.29.29.29
    # 国内游戏域名（腾讯/网易等，解析错会连到外服）
    "geosite:category-games@cn":
      - 223.5.5.5
      - 119.29.29.29

  # --- fake-ip 白名单（这些域名返回真实 IP，不用 198.18.x.x）---
  fake-ip-filter:
    # ===== 局域网 / 路由器后台 =====
    # 私有域名集合，整体排除
    - "geosite:private"
    # .lan 本地域名（部分路由器用）
    - "+.lan"
    # .local mDNS 域名（Bonjour / 打印机 / 投屏）
    - "+.local"
    # .internal 企业内部域名
    - "+.internal"
    # .localdomain 部分 Linux/路由器默认域
    - "+.localdomain"
    # .home.arpa 家庭网络标准域（RFC 8375）
    - "+.home.arpa"
    # .bogon 保留/私有地址反查域
    - "+.bogon"
    # .m2m 物联网设备域（部分模组用）
    - "+.m2m"
    # 本机名
    - localhost
    # 华硕路由器管理后台
    - router.asus.com
    # 小米路由器管理后台
    - miwifi.com
    # TP-Link 路由器管理后台
    - tplogin.cn
    # 腾达路由器管理后台
    - tendawifi.com
    # 迅捷/水星路由器管理后台
    - p.to

    # ===== AdGuard =====
    # AdGuard 的脚本注入域名（走广告拦截会破坏其功能）
    - injections.adguard.org
    # AdGuard 本地回环域名
    - local.adguard.org

    # ===== 网络连通性探测 =====
    # Windows NCSI 检测
    - "+.msftncsi.com"
    # Windows 联网检测（NCSI 的备用域名）
    - "+.msftconnecttest.com"
    # 苹果 Captive Portal 检测
    - captive.apple.com
    # 谷歌连通性检测
    - connectivitycheck.gstatic.com
    # 安卓连通性检测
    - connectivitycheck.android.com
    # 小米连通性检测
    - connect.rom.miui.com

    # ===== 游戏 STUN / NAT =====
    # 任天堂 Switch 联机（NAT 类型判定）
    - "+.srv.nintendo.net"
    # PlayStation 联机
    - "+.stun.playstation.net"
    # Xbox Live 联机
    - "+.xboxlive.com"
    # Xbox 部分服务（官方文档给出的合法一级通配示例）
    - "xbox.*.microsoft.com"
    # 暴雪国服联机
    - "+.battlenet.com.cn"
    # Twilio TURN 中继（语音/视频通话打洞）
    - "+.turn.twilio.com"
    # Twilio STUN 打洞
    - "+.stun.twilio.com"
    # Syncthing 的 STUN 服务器
    - stun.syncthing.net
    # 谷歌 STUN 服务器（WebRTC 常用）
    - stun.l.google.com
    # Cloudflare STUN 服务器
    - stun.cloudflare.com

    # ===== NTP 时间同步 =====
    # NTP 公共池（含 cn.pool.ntp.org 等所有子域）
    - "+.pool.ntp.org"
    # Windows 默认时间服务器
    - time.windows.com
    # 美国 NIST 时间服务器
    - time.nist.gov
    # 苹果时间服务器
    - time.apple.com
    # 苹果亚洲时间服务器
    - time.asia.apple.com
    # Cloudflare 时间服务器
    - time.cloudflare.com

    # ===== 开发者泛域名 =====
    # sslip.io：把 IP 写进域名的解析服务（如 192-168-1-1.sslip.io）
    - "+.sslip.io"
    # nip.io：同 sslip.io 的另一种实现
    - "+.nip.io"
    # skk.moe 的 127 回环测试域名
    - 127.atlas.skk.moe

# ==============================================================================
# 三、域名嗅探
# ==============================================================================
sniffer:
  # 是否启用嗅探。
  enable: true

  # 对 redir-host 模式识别的流量强制嗅探。
  force-dns-mapping: true

  # 对所有没拿到域名的流量（纯 IP 连接）也强制嗅探。
  parse-pure-ip: true

  # 用嗅探出的域名覆盖原目标地址，使规则按域名匹配而不是按 IP。
  override-destination: true

  # 各协议的嗅探端口
  sniff:
    # 明文 HTTP
    HTTP:
      # 80 与 8080-8880（常见 HTTP 代理/备用端口）
      ports: [80, 8080-8880]
      # 本协议也覆盖目标地址
      override-destination: true
    # TLS（HTTPS）：从 ClientHello 的 SNI 字段取域名
    TLS:
      # 443 标准 HTTPS，8443 常见备用 HTTPS
      ports: [443, 8443]
      # 本协议也覆盖目标地址
      override-destination: true
    # QUIC（HTTP/3）：从 Initial 包取 SNI
    QUIC:
      # 443 标准，8443 备用
      ports: [443, 8443]

  # 跳过嗅探的域名（这些多是加密协议或会因嗅探出错）
  skip-domain:
    # 小米设备（部分固件对 SNI 嗅探不友好）
    - "+.mi.com"
    - "+.xiaomi.com"
    - "+.xiaomi.net"
    # 米家智能家居（设备频繁短连接，嗅探反而增加延迟）
    - "+.mijia.tech"
    # 苹果推送（APNs 长连接，嗅探无意义且可能断开）
    - "+.push.apple.com"
    # 苹果全系
    - "+.apple.com"
    # 局域网域名
    - "+.local"
    - "+.lan"
    - "+.home.arpa"

# ==============================================================================
# 四、GeoData 数据源
# ==============================================================================
# 使用 geodata 格式（.dat）而非 mmdb，加载更快、支持 geosite。
geodata-mode: true
# 自动更新 GeoIP/GeoSite 数据库。
geo-auto-update: true
# 更新间隔（小时）。24 = 每天一次。
geo-update-interval: 24
# 数据库下载源
geox-url:
  geoip:   "https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb:    "https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn:     "https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

